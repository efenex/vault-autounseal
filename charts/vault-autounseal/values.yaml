# Default values for vault-autounseal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: efenex/vault-autounseal
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# fsGroup is a DEFAULT HERE ON PURPOSE, and removing it will break mutual TLS.
#
# The image is gcr.io/distroless/python3-debian12:nonroot, so the process runs
# as uid/gid 65532. Kubernetes writes secret- and configMap-volume files owned
# root:root, and applies fsGroup as the GROUP owner. Without an fsGroup, a
# mounted client-certificate key is root-owned and the only process that needs
# it cannot open it.
#
# That failure is genuinely hard to read: Python raises the EACCES from inside
# the TLS handshake, so requests reports
#   ('Connection aborted.', PermissionError(13, 'Permission denied'))
# which looks like a network fault, on a pod that is happily Running 1/1.
# Observed in production 2026-08-26 against vault-{0,1,2}.radiomics.bio.
#
# Keep this in sync with the base image's uid/gid if that ever changes.
podSecurityContext:
  fsGroup: 65532

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

settings:
  # vault_url: "https://vault.vault.cluster.local:8200"
  # vault unlocking keys settings:
  vault_secret_shares: 3
  vault_secret_threshold: 2
  # secret for storing vault root token
  vault_root_token_secret: vault-root-token
  # secret for storing vault unlock keys
  vault_keys_secret: vault-keys
  # time between polling for vault status, in seconds
  scan_delay: 5
  # vault label used to retrieve the vault instance (scan mode only, i.e.
  # when vault_url is unset)
  vault_label_selector: app.kubernetes.io/instance=vault,component=server

# Extra volumes and mounts, e.g. a client certificate for mutual TLS.
# Pair these with settings.vault_client_cert / vault_client_key.
#
#   extraVolumes:
#     - name: vault-client-tls
#       secret:
#         secretName: vault-autounseal-client-tls
#         defaultMode: 0440
#   extraVolumeMounts:
#     - name: vault-client-tls
#       mountPath: /tls
#       readOnly: true
#
# NOTE ON defaultMode: use 0440, not 0400. 0400 is the instinctive choice for a
# private key and it does not work here -- the file is owned root:root, this
# container is not root, and owner-only permissions lock out the one process
# that needs the key. 0440 grants read to the group, which podSecurityContext
# .fsGroup above sets to the container's own gid. Both halves are required:
# fsGroup with 0400 still yields owner-only, and 0440 without fsGroup leaves
# the group as root.
extraVolumes: []
extraVolumeMounts: []
